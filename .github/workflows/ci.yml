name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs first, because everything after it reports only on what it was configured to
      # look at. A linter that lost its type-aware rules, a tsconfig that lost a flag, or a
      # coverage threshold quietly deleted - all three still exit 0, so the absence has to
      # be checked directly.
      - name: Config coverage
        run: npm run check:config

      # Includes the 20-line cap on functions.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `npm test` measures coverage and fails under the thresholds in vitest.config.ts.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # A credential committed once is committed for good: rewriting history does not
  # un-publish it, and this repository is going public. So the gate runs over the whole
  # history, not just the diff.
  #
  # gitleaks/gitleaks-action@v2 needs a paid licence key for organisation repositories,
  # so the binary is fetched directly - pinned to a version and verified against the
  # checksum published with that release, because a secret scanner fetched over the
  # network without verification is a supply-chain hole of exactly the kind it exists
  # to prevent.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, or the scan only sees the tip

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      # --redact so a finding does not leak the secret again into public build logs.
      - name: Scan history
        run: ./gitleaks git --no-banner --redact --exit-code 1

      - name: Scan the working tree
        run: ./gitleaks dir . --no-banner --redact --exit-code 1

  # Every file under examples/ must satisfy spec/voyage.schema.json. A scenario that
  # no longer validates is a format change that was not written down, and it is the
  # one failure the unit tests cannot see: they exercise the code, not the data.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate every example against the schema
        run: npx vitest run test/examples.spec.ts
