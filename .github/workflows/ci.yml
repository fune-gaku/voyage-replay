name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs first, because everything after it reports only on what it was configured to
      # look at. A linter that lost its type-aware rules, or a tsconfig that lost a flag,
      # still exits 0 - so the absence has to be checked directly.
      - name: Config coverage
        run: npm run check:config

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Every file under examples/ must satisfy spec/voyage.schema.json. A scenario that
  # no longer validates is a format change that was not written down, and it is the
  # one failure the unit tests cannot see: they exercise the code, not the data.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate every example against the schema
        run: npx vitest run test/examples.spec.ts
