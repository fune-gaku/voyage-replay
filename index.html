<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voyage-replay</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #16202b;
        --muted: #5b6b7c;
        --bg: #f6f8fa;
        --panel: #ffffff;
        --line: #d7dee6;
        --warn: #9a3412;
        --accent: #1f6feb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #dbe4ee;
          --muted: #8fa3b8;
          --bg: #0e151c;
          --panel: #16202b;
          --line: #263544;
          --warn: #fca5a5;
          --accent: #58a6ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.5rem 1.25rem 4rem;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.6 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      main {
        max-width: 64rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 1rem;
      }
      h1 small {
        color: var(--muted);
        font-weight: 400;
        margin-left: 0.5rem;
      }
      #stage {
        background: #05080e;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      #view {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 0.75rem;
        align-items: center;
        padding: 0.6rem 0.75rem;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      #controls .group {
        display: flex;
        gap: 0.25rem;
        align-items: center;
      }
      button,
      select {
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 0.25rem 0.6rem;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.recording {
        background: var(--warn);
        border-color: var(--warn);
        color: #fff;
      }
      #clock {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        min-width: 9.5rem;
      }
      #scrub {
        flex: 1 1 16rem;
        min-width: 12rem;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-top: 1rem;
      }
      h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 0.75rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 0.3rem 0.75rem 0.3rem 0;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      .warn {
        color: var(--warn);
      }
      .scroll {
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>voyage-replay <small id="subtitle">loading&hellip;</small></h1>

      <div id="stage" hidden>
        <canvas id="view"></canvas>
        <div id="controls">
          <div class="group" id="views"></div>
          <button id="playPause">Play</button>
          <label class="group">
            <select id="speed" title="Playback speed" aria-label="Playback speed">
              <option value="1">1&times;</option>
              <option value="10">10&times;</option>
              <option value="20" selected>20&times;</option>
              <option value="60">60&times;</option>
            </select>
          </label>
          <label class="group">
            <!--
              Metres of sea from the top of the plan view to the bottom. Height rather than
              width because it does not move when the window is resized, and a scale that
              changed with the shape of the browser would be no scale at all.

              The wide end is a locator, not an instrument. Everything is projected onto one
              flat plane pinned at the scenario origin (see src/core/geodesy.ts), which costs
              centimetres over the few kilometres a reconstruction actually spans and 1.1% of
              east-west stretch a hundred kilometres away, 5.9% at five hundred, 13.3% at a
              thousand. Read a distance off those and it is wrong; read "which sea is this"
              off them and it is right.
            -->
            <select
              id="scale"
              title="Plan view: how much sea the frame covers, top to bottom. Past about 100 km it is a locator rather than a measurement - the flat local plane stretches east-west with distance."
              aria-label="Plan view scale"
            >
              <option value="auto" selected>Scale: auto</option>
              <option value="200">Scale: 200 m</option>
              <option value="500">Scale: 500 m</option>
              <option value="1000">Scale: 1 km</option>
              <option value="2000">Scale: 2 km</option>
              <option value="5000">Scale: 5 km</option>
              <option value="10000">Scale: 10 km</option>
              <option value="20000">Scale: 20 km</option>
              <option value="50000">Scale: 50 km</option>
              <option value="100000">Scale: 100 km</option>
              <option value="200000">Scale: 200 km</option>
              <option value="500000">Scale: 500 km</option>
              <option value="1000000">Scale: 1000 km</option>
            </select>
          </label>
          <button
            id="recentre"
            title="Plan view: follow the ships again after dragging the picture"
          >
            Recentre
          </button>
          <span id="clock">&mdash;</span>
          <input id="scrub" type="range" min="0" max="1000" value="0" />
          <button id="record">Record</button>
        </div>
      </div>

      <div id="panels"></div>
    </main>
    <!--
      A single-file build writes the scenario in here, so the page opens straight off the
      filesystem with nothing to fetch. Left empty, the page falls back to fetching one.
    -->
    <script type="application/json" id="scenario"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
