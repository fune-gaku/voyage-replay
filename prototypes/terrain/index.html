<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voyage-replay prototype — land from a bridge</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05080e;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 14px;
        margin: 0;
        color: #e8eef5;
        font:
          12px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <pre id="hud"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
